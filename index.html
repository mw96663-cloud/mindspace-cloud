
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142a36">
  <title>Mindspace｜想像正在發生</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #142a36;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    canvas {
      display: block;
    }

    #fullscreenButton {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 10;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 24px;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    #fullscreenButton:hover {
      background: rgba(255,255,255,0.24);
    }

    @media (max-width: 600px) {
      #fullscreenButton {
        top: 12px;
        right: 12px;
        padding: 10px 13px;
      }
    }
  </style>
</head>

<body>
  <button id="fullscreenButton" type="button">⛶ 全螢幕</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="./sketch.js"></script>

  <script>
    const fullscreenButton = document.getElementById("fullscreenButton");

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fullscreenButton.textContent = "⤢ 離開全螢幕";
        } else {
          await document.exitFullscreen();
          fullscreenButton.textContent = "⛶ 全螢幕";
        }
      } catch (error) {
        alert("目前瀏覽器無法切換全螢幕，請確認瀏覽器權限。");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent =
        document.fullscreenElement ? "⤢ 離開全螢幕" : "⛶ 全螢幕";
    });
  </script>
</body>
</html>
