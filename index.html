
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142a36">
  <title>Mindspace｜想像正在發生</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #142a36;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    canvas { display: block; }
    button { cursor: pointer; font-family: inherit; }
    #fullscreenButton {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 20;
      padding: 11px 17px;
      border: 1px solid #ffffff55;
      border-radius: 25px;
      color: white;
      background: #ffffff22;
    }
    #panel {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: min(92vw, 600px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      text-align: center;
      color: white;
      pointer-events: none;
    }
    #panel > * { pointer-events: auto; }
    #micButton {
      padding: 14px 26px;
      border: 1px solid #ffffff77;
      border-radius: 35px;
      background: #17546d;
      color: white;
      font-size: 17px;
    }
    #micButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #status {
      max-width: 100%;
      padding: 9px 14px;
      border-radius: 13px;
      background: #071923bb;
      font-size: 14px;
      line-height: 1.6;
    }
    #transcript {
      max-width: 100%;
      max-height: 75px;
      overflow: auto;
      font-size: 15px;
      text-shadow: 0 1px 4px black;
    }
  </style>
</head>
<body>
  <button id="fullscreenButton">
    ⛶ 全螢幕
  </button>

  <div id="panel">
    <button id="micButton">
      🎤 開始說出想像
    </button>
    <div id="status" role="status"
         aria-live="polite">
      點擊麥克風，說出你的想像
    </div>
    <div id="transcript"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="./sketch.js"></script>

  <script>
    const fullButton =
      document.getElementById("fullscreenButton");

    fullButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        alert("無法切換全螢幕：" + e.message);
      }
    });

    document.addEventListener(
      "fullscreenchange", () => {
        fullButton.textContent =
          document.fullscreenElement
            ? "⤢ 離開全螢幕"
            : "⛶ 全螢幕";
      }
    );
  </script>
</body>
</html>
