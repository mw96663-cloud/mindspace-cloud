<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Mindspace｜AI 想像世界</title>

  <link rel="stylesheet" href="./style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
  <script src="./sketch.js" defer></script>
</head>

<body>

  <main class="app">

    <header class="header">
      <h1>Mindspace</h1>
      <p>說出你的想像，讓 AI 創造世界</p>
    </header>

    <section class="world-section">
      <div id="canvas-container"></div>
    </section>

    <section class="controls">

      <label for="idea-input">
        你想創造什麼世界？
      </label>

      <textarea
        id="idea-input"
        rows="3"
        placeholder="例如：我想要一個粉紅色的森林，天空有星星和月亮"
      >紫色的森林，天空有星星和月亮</textarea>

      <div class="buttons">

        <button id="mic-button" type="button">
          🎤 開始語音辨識
        </button>

        <button id="generate-button" type="button">
          ✨ 生成 AI 世界
        </button>

      </div>

      <p id="status" role="status" aria-live="polite">
        準備完成，請開始說話或輸入文字。
      </p>

      <p id="model-info"></p>

    </section>

  </main>

</body>
</html>
